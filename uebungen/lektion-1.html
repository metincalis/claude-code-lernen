<!doctype html>
<!-- Sagt dem Browser: Das ist modernes HTML5 (ohne diese Zeile rät er und rendert im "Quirks Mode"). -->

<!-- lang="de": Seite ist deutsch – wichtig für Vorleseprogramme, Silbentrennung und Suchmaschinen. -->
<html lang="de">

<!-- <head>: unsichtbare Infos ÜBER die Seite (wie der Beipackzettel einer Packung). -->
<head>
  <!-- Zeichensatz UTF-8, damit Umlaute wie ä, ö, ü und ß richtig angezeigt werden. -->
  <meta charset="utf-8">

  <!-- Auf dem Handy: Seite in echter Gerätebreite anzeigen statt winzig verkleinert. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Text im Browser-Tab und in Lesezeichen. -->
  <title>Lektion 1 – Meine erste Seite</title>

  <!-- Das Aussehen kommt aus der gemeinsamen CSS-Datei (seit Lektion 2).
       "../" heißt: einen Ordner nach oben, also von uebungen/ ins Hauptverzeichnis, dann in css/. -->
  <link rel="stylesheet" href="../css/style.css">
</head>

<!-- <body>: alles, was man im Browserfenster SIEHT. -->
<body>
  <!-- <h1>: Hauptüberschrift. Pro Seite genau eine. -->
  <h1>Hallo Welt!</h1>

  <!-- <p>: ein Absatz Fließtext. -->
  <p>Das ist meine erste HTML-Seite im Lernprojekt <strong>Claude Code lernen</strong>.</p>

  <!-- <h2>: Zwischenüberschrift, eine Ebene unter <h1>. -->
  <h2>Was ich in Lektion 1 gelernt habe</h2>

  <!-- <ul> = ungeordnete Liste (Punkte), jedes <li> ist ein Listeneintrag. -->
  <ul>
    <li>Ein Git-Repository anlegen und den ersten Commit machen</li>
    <li>Ordner und Dateien strukturiert anlegen</li>
    <li>Das Grundgerüst einer HTML-Seite</li>
  </ul>
</body>
</html>
